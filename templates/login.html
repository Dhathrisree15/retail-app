<!DOCTYPE html>
<html>
<head>
    <title>RetailIQ Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; 
               align-items: center; height: 100vh; background: #f0f2f5; }
        .box { background: white; padding: 2rem; border-radius: 10px; 
               width: 350px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        h2 { text-align: center; color: #4f46e5; }
        input { width: 100%; padding: 10px; margin: 8px 0; 
                border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4f46e5; 
                 color: white; border: none; border-radius: 5px; 
                 cursor: pointer; font-size: 16px; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛒 RetailIQ</h2>
        <p style="text-align:center;color:gray;">Retail Analytics Platform</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Login</button>
        </form>
        <p style="text-align:center;color:gray;font-size:12px;margin-top:10px;">
            Use: admin / password123
        </p>
    </div>
</body>
</html>
